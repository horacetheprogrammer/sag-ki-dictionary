        // Precise, phonetically aligned transcription algorithm map
        const multiMap = [
            { lat: 'zh', cyr: 'ж' }, { lat: 'sh', cyr: 'ш' }, { lat: 'ch', cyr: 'ч' }, { lat: 'th', cyr: 'ҫ' },
            { lat: 'Zh', cyr: 'Ж' }, { lat: 'Sh', cyr: 'Ш' }, { lat: 'Ch', cyr: 'Ч' }, { lat: 'Th', cyr: 'Ҫ' },

        ];
        
        const singleMap = [
            { lat: 'a', cyr: 'а' }, { lat: 'ä', cyr: 'ӓ' }, { lat: 'e', cyr: 'е' }, { lat: 'ë', cyr: 'ё' },

            { lat: 'I', cyr: 'И' }, { lat: 'O', cyr: 'О' }, { lat: 'U', cyr: 'У' }, { lat: 'P', cyr: 'П' },
            { lat: 'B', cyr: 'Б' }, { lat: 'T', cyr: 'Т' }, { lat: 'D', cyr: 'Д' }, { lat: 'K', cyr: 'К' },
            { lat: 'G', cyr: 'Г' }, { lat: 'F', cyr: 'Ф' }, { lat: 'V', cyr: 'В' }, { lat: 'S', cyr: 'С' },
            { lat: 'Z', cyr: 'З' }, { lat: 'M', cyr: 'М' }, { lat: 'N', cyr: 'Н' }, { lat: 'R', cyr: 'Р' },
            { lat: 'L', cyr: 'Л' }, { lat: 'H', cyr: 'Һ' }, { lat: 'Y', cyr: 'Й' }
        ];

        // Robust, high-speed phonetic transliteration parser
        function convertToCyrillic(text) {
            if (!text) return "";
            let result = "";
            let i = 0;
            while (i < text.length) {
                let matched = false;
                for (let map of multiMap) {
                    if (text.substr(i, map.lat.length) === map.lat) {
                        result += map.cyr;
                        i += map.lat.length;
                        matched = true;
                        break;
                    }
                }
                if (matched) continue;
                for (let map of singleMap) {
                    if (text.substr(i, map.lat.length) === map.lat) {
                        result += map.cyr;
                        i += map.lat.length;
                        matched = true;
                        break;
                    }
                }
                if (!matched) {
                    result += text[i];
                    i++;
                }
            }
            return result;
        }

        function renderWordList() {
            const container = document.getElementById('wordListContainer');
            container.innerHTML = '';

            const filtered = rawData.filter(item => {
                const cyrillicForm = convertToCyrillic(item.word);
                const matchesSearch = item.word.toLowerCase().includes(queryFilter) || 
                                      cyrillicForm.includes(queryFilter) ||
                                      Object.values(item.uses[0].explanation).some(t => t.toLowerCase().includes(queryFilter));
                const matchesPos = posFilter === 'ALL' || item.uses[0].type === posFilter;
                return matchesSearch && matchesPos;
            });

            document.getElementById('entryCount').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-sm italic text-parchment-500">No definitions found.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isSelected = activeSelection && activeSelection.word === item.word;
                const div = document.createElement('div');
                div.className = `p-4 cursor-pointer transition-all border-l-4 ${
                    isSelected 
                        ? 'bg-parchment-300/40 border-pine dark:bg-zinc-800/60 dark:border-pine' 
                        : 'border-transparent hover:bg-parchment-300/20 dark:hover:bg-zinc-800/30'
                }`;

                const currentExplanation = getTranslation(item.uses[0].explanation);
                const cyrillicForm = convertToCyrillic(item.word);

                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-serif font-bold text-base tracking-wide">${item.word} <span class="text-parchment-400 dark:text-darkmode-muted font-normal">/ ${cyrillicForm}</span></span>
                        <span class="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-parchment-300 dark:bg-zinc-800 text-parchment-700 dark:text-darkmode-muted">${item.uses[0].type}</span>
                    </div>
                    <p class="text-xs text-parchment-500 dark:text-darkmode-muted mt-1 truncate">${currentExplanation}</p>
                `;

                div.onclick = () => {
                    activeSelection = item;
                    renderDetailPane();
                    renderWordList();
                    if (window.innerWidth < 768) toggleSidebar();
                };

                container.appendChild(div);
            });
        }

        function getTranslation(engString) {
            if (currentLanguage === 'en') return engString;
            if (translationDb[currentLanguage] && translationDb[currentLanguage][engString]) {
                return translationDb[currentLanguage][engString];
            }
            return engString; 
        }

        function renderDetailPane() {
            const defaultScreen = document.getElementById('defaultScreen');
            const detailScreen = document.getElementById('detailScreen');

            if (!activeSelection) {
                defaultScreen.classList.remove('hidden');
                detailScreen.classList.add('hidden');
                return;
            }

            defaultScreen.classList.add('hidden');
            detailScreen.classList.remove('hidden');

            const labels = textLabels[currentLanguage] || textLabels['en'];
            const useData = activeSelection.uses[0];

            const translationText = getTranslation(useData.explanation);
            const etymologyText = getTranslation(useData.etymology);
            const exampleTransText = getTranslation(useData.exampleTranslation);

            const wordCyrillic = convertToCyrillic(activeSelection.word);

            let examplesBlock = '';
            if (useData.example) {
                const exampleCyrillic = convertToCyrillic(useData.example);
                examplesBlock = `
                    <div class="mt-8 border-t border-parchment-300 dark:border-darkmode-border pt-6">
                        <h3 class="text-xs uppercase font-bold tracking-widest text-pine mb-4">${labels.examples}</h3>
                        <div class="space-y-3">
                            <div class="p-4 rounded-sm bg-parchment-200/50 dark:bg-darkmode-surface border border-parchment-300 dark:border-darkmode-border">
                                <p class="font-serif text-lg italic text-pine dark:text-darkmode-text">${useData.example}</p>
                                <p class="font-serif text-base italic text-pine dark:text-darkmode-text mt-1">${exampleCyrillic}</p>
                                <p class="text-sm text-parchment-700 dark:text-darkmode-text mt-3 pt-2 border-t border-dashed border-parchment-300 dark:border-zinc-800">${exampleTransText}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            detailScreen.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-parchment-300 dark:border-darkmode-border pb-6">
                        <div class="flex flex-wrap items-baseline gap-4">
                            <h1 class="font-script text-4xl font-bold tracking-wide text-pine">
                                ${activeSelection.word} <span class="text-2xl font-serif text-parchment-400 dark:text-darkmode-muted font-normal">/ ${wordCyrillic}</span>
                            </h1>
                        </div>
                        <div class="mt-3 flex items-center gap-2">
                            <span class="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded border border-parchment-300 dark:border-darkmode-border bg-parchment-200 dark:bg-darkmode-surface">${useData.type}</span>
                            ${useData.hasBadge ? `<span class="text-[9px] uppercase font-bold tracking-widest px-2 py-0.5 rounded bg-pine text-white">${useData.badgeText}</span>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h3 class="text-xs uppercase font-bold tracking-widest text-parchment-500 dark:text-darkmode-muted mb-2">${labels.translation}</h3>
                            <p class="font-serif text-base leading-relaxed">${translationText}</p>
                        </div>
                        <div class="border-t md:border-t-0 md:border-l border-parchment-300 dark:border-darkmode-border pt-4 md:pt-0 md:pl-6">
                            <h3 class="text-xs uppercase font-bold tracking-widest text-parchment-500 dark:text-darkmode-muted mb-2">${labels.etymology}</h3>
                            <p class="text-sm text-parchment-600 dark:text-darkmode-muted leading-relaxed italic">${etymologyText || 'No etymological trace found.'}</p>
                        </div>
                    </div>

                    ${examplesBlock}
                </div>
            `;
        }

        function clearSelection() {
            activeSelection = null;
            renderDetailPane();
            renderWordList();
        }

        function selectRandom() {
            if (rawData.length === 0) return;
            const randomIndex = Math.floor(Math.random() * rawData.length);
            activeSelection = rawData[randomIndex];
            renderDetailPane();
            renderWordList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('posFilter').value = 'ALL';
            queryFilter = '';
            posFilter = 'ALL';
            renderWordList();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            document.getElementById('searchInput').addEventListener('input', (e) => {
                queryFilter = e.target.value.toLowerCase();
                renderWordList();
            });

            document.getElementById('posFilter').addEventListener('change', (e) => {
                posFilter = e.target.value;
                renderWordList();
            });

            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLanguage = e.target.value;
                renderWordList();
                if (activeSelection) renderDetailPane();
            });

            renderWordList();
        });
    </script>
